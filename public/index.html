<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Studio — GIS &amp; Map Making</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <h1>Atlas <span>Studio</span></h1>
      <p>Search any place. Style your map. Layer your data.</p>
    </header>

    <section class="panel">
      <label class="panel-title" for="search-input">Find a place</label>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="Country, city, address, landmark…" autocomplete="off">
        <button id="search-btn" title="Search">Go</button>
      </div>
      <ul id="search-results" class="search-results hidden"></ul>
    </section>

    <section class="panel">
      <h2 class="panel-title">Basemap style</h2>
      <div id="basemap-picker" class="chip-grid"></div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Data</h2>
      <div class="button-row">
        <label class="btn file-btn">
          Import CSV / GeoJSON
          <input id="file-input" type="file" accept=".csv,.json,.geojson,application/json,text/csv" hidden>
        </label>
        <button id="refresh-datasets" class="btn ghost" title="Refresh server datasets">↻</button>
      </div>
      <div id="dataset-list" class="dataset-list"></div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Layers on map</h2>
      <div id="layer-list" class="layer-list">
        <p class="empty-hint">No data layers yet. Load a dataset above or import your own file — e.g. a CSV of all your company's locations with <code>lat</code>/<code>lng</code> columns.</p>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Tools</h2>
      <div class="button-row">
        <button id="fit-data" class="btn">Fit to data</button>
        <button id="export-png" class="btn">Export PNG</button>
        <button id="copy-embed" class="btn">Copy embed link</button>
      </div>
    </section>

    <footer class="panel footnote">
      <a href="/examples/embed-example.html" target="_blank">SDK examples</a> ·
      <a href="/api/health" target="_blank">API</a> ·
      <span id="status-zoom"></span>
    </footer>
  </aside>

  <main id="map"></main>

  <div id="timeline-bar" class="timeline-bar hidden">
    <div class="tl-transport">
      <button id="tl-prev" class="tl-btn" title="Previous frame">⏮</button>
      <button id="tl-play" class="tl-btn tl-play" title="Play / pause">▶</button>
      <button id="tl-next" class="tl-btn" title="Next frame">⏭</button>
    </div>
    <div class="tl-track">
      <input id="tl-scrubber" class="tl-scrubber" type="range" min="0" max="0" step="1" value="0">
      <div class="tl-meta">
        <span id="tl-timestamp" class="tl-timestamp">—</span>
        <span id="tl-frame" class="tl-frame"></span>
      </div>
    </div>
    <div class="tl-options">
      <label class="tl-speed">
        Speed
        <select id="tl-speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <div class="tl-export">
        <button id="tl-export-btn" class="tl-btn tl-export-btn" title="Export time-lapse">Export ▾</button>
        <div id="tl-export-menu" class="tl-export-menu hidden">
          <button data-format="gif">Animated GIF</button>
          <button data-format="webm">WebM video</button>
        </div>
      </div>
    </div>
    <div id="tl-progress" class="tl-progress hidden"><span class="tl-progress-track"><span id="tl-progress-bar"></span></span><em id="tl-progress-label"></em></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/sdk/atlas-sdk.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
